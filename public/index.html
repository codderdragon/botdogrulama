<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodderDragon Bot - Ana Sayfa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #1a1a2e 50%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px;
      max-width: 600px;
    }
    .logo {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    h1 {
      font-size: 2.5em;
      background: linear-gradient(90deg, #5865F2, #EB459E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #8e8e8e;
      font-size: 1.1em;
      margin-bottom: 40px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .links a {
      display: block;
      padding: 16px 30px;
      background: rgba(88, 101, 242, 0.15);
      border: 1px solid rgba(88, 101, 242, 0.3);
      border-radius: 12px;
      color: #5865F2;
      text-decoration: none;
      font-size: 1.05em;
      transition: all 0.3s ease;
    }
    .links a:hover {
      background: rgba(88, 101, 242, 0.3);
      transform: translateX(5px);
      box-shadow: 0 4px 20px rgba(88, 101, 242, 0.2);
    }
    .links a span { margin-right: 10px; }
    .footer {
      margin-top: 50px;
      color: #555;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🐉</div>
    <h1>CodderDragon Bot</h1>
    <p class="subtitle">Discord Bot Doğrulama & Yönetim Sistemi</p>

    <div class="links">
      <a href="/linked-role">
        <span>🔗</span> Bağlı Rol Doğrulama
      </a>
      <a href="/terms">
        <span>📜</span> Hizmet Koşulları
      </a>
      <a href="/privacy">
        <span>🔒</span> Gizlilik Politikası
      </a>
    </div>

    <p class="footer">© 2026 CodderDragon. Tüm hakları saklıdır.</p>
  </div>
</body>
</html>
